<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dice-Mice!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Dice-Mice!</h1>

  <section id="startskjerm" class="startskjerm">
    <p class="etikett">Antall spillere</p>
    <div id="antallValg" class="antall-valg">
      <button type="button" data-antall="1">1</button>
      <button type="button" data-antall="2">2</button>
      <button type="button" data-antall="3">3</button>
      <button type="button" data-antall="4">4</button>
    </div>

    <form id="navneskjema">
      <p class="etikett">Navn</p>
      <div id="navnefelt" class="navnefelt"></div>
      <button type="submit">Start spillet</button>
    </form>
  </section>

  <main id="spillet" hidden>
    <svg id="brett" viewBox="0 -30 700 730" aria-label="Spillbrettet"></svg>

    <aside>
      <ul id="spillerliste" class="spillerliste" aria-label="Spillere"></ul>
      <p id="status"></p>
      <div id="terning" class="terning" aria-live="polite"></div>
      <button id="kast">Kast terningen</button>
    </aside>
  </main>

  <script src="game.js"></script>
</body>
</html>
